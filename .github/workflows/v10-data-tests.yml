name: FireLens global archive and app checks
on:
  push:
    branches: [v11-global-navigation, v12-california-evidence-inspector, v13-judge-readiness, v14-visual-usability, round4-engineering, round5-modviir, main]
    paths:
      - "v10/**"
      - "v11/**"
      - "v12/**"
      - "v13/**"
      - "v14/**"
      - "v15/**"
      - "tests/**"
      - "app.py"
      - "critical_periods.py"
      - ".github/workflows/v10-data-tests.yml"
  workflow_dispatch:

jobs:
  regional-preprocessing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install processing dependencies
        run: python -m pip install -r requirements.txt pycountry
      - name: Compile V10 code
        run: python -m compileall -q app.py critical_periods.py v10 v11 v12 v13 v14 v15
      - name: Test V10 regional pipeline
        run: python -m unittest discover -s v10 -p "test_*.py" -v
      - name: Check 34-source global archive totals
        run: python -m unittest discover -s v11 -p "test_*.py" -v
      - name: Test Park Fire Evidence Inspector against frozen V8 audit
        run: python -m unittest discover -s v12 -p "test_*.py" -v
      - name: Reproduce model and bootstrap audit
        run: python -m unittest discover -s v13 -p "test_*.py" -v
      - name: Test common harmonization grid unit
        run: python -m unittest discover -s v14 -p "test_*.py" -v
      - name: Test Tier-1 satellite record calibration
        run: python -m unittest discover -s tests -p "test_calibration.py" -v
      - name: Verify LOYO calibration results against saved CSV
        run: python -m unittest discover -s tests -p "test_validation.py" -v
      - name: Test four-country historical calibrated calendar
        run: python -m unittest discover -s tests -p "test_calendar.py" -v
      - name: Test full Streamlit world dashboard
        run: python v10/smoke_app.py
      - name: Test interactive Evidence Inspector controls
        run: python v12/smoke_inspector.py
      - name: Test guided judge storyline navigation
        run: python v13/smoke_storyline.py
