name: V10 archive preprocessing tests
on:
  push:
    branches: [v10-data-foundation]
    paths:
      - "v10/**"
      - ".github/workflows/v10-data-tests.yml"
  workflow_dispatch:

jobs:
  regional-preprocessing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install processing dependencies
        run: python -m pip install "numpy>=1.24,<3" "pandas>=2.0,<3" "pyproj>=3.5,<4"
      - name: Compile V10 code
        run: python -m compileall -q v10
      - name: Test V10 regional pipeline
        run: python -m unittest discover -s v10 -p "test_*.py" -v
